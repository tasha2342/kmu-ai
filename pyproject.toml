[project]
name = "kmu-ai-api"
version = "0.1.0"
description = "계명대학교 AI 챗봇 백엔드입니다."
authors = [{ name = "Jeongwon", email = "banb3515@gmail.com" }]
requires-python = "~=3.13.0"
dependencies = [
    "orjson>=3.11.3",
    "fastapi==0.129.0",
    "uvicorn>=0.34.0,<0.35",
    "gunicorn>=23.0.0",
    "pyyaml>=6.0.1,<7",
    "sse-starlette>=2.0.0,<3",
    "pydantic>=2.6.3,<3",
    "python-keycloak",
    "psycopg2-binary>=2.9.9,<3",
    "pytest>=8.2.2,<9",
    "peewee>=3.18.1",
    "peewee-async>=0.12.1,<0.13",
    "aiopg>=1.4.0,<2",
    "pytz~=2024.1",
    "tqdm>=4.66.5,<5",
    "toml>=0.10.2,<0.11",
    "redis>=5.2.1,<6",
    "aiohttp>=3.11.14,<4",
    "pydantic-settings>=2.8.1,<3",
    "multidict==6.4.3",
    "aiofiles>=24.1.0",
    "shapely>=2.1.1",
    "apscheduler>=3.11.0",
    "slowapi>=0.1.9",
    "starlette-compress>=1.6.1",
    "rich>=14.0.0",
    "litellm>=1.80.11",
    "boto3>=1.42.24",
    "pgvector>=0.3.6,<0.4",
    # 학칙·규정 HWP 본문/표 추출 (hwp5txt, hwp5html)
    "pyhwp>=0.1b15",
    "neo4j>=5.28.0",
    "networkx>=3.4.2",
    "huggingface-hub>=1.2.3",
    # 컨테이너 내장 임베딩 (app/utils/embedder.py)
    # torch는 여기에 넣지 않는다. PyPI의 리눅스 torch 휠은 nvidia-* CUDA 런타임을 의존성으로 끌어와
    # 이미지가 2GB 넘게 불어난다. CPU 전용 휠을 Dockerfile에서 PyTorch 인덱스로 직접 설치한다.
    "transformers>=4.57.0",
    "python-multipart>=0.0.22",
    # 챗봇 PDF/HWP 첨부 페이지 렌더 + DOCX 표 이미지
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    # 챗봇 오케스트레이션 (의도 분류 -> 검색 -> 생성 그래프)
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-litellm>=0.2.0",
]

[dependency-groups]
dev = [
    "black>=23.9.1,<24",
    "isort>=5.12.0,<6",
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.25.3,<0.26",
]

[tool.uv]

[tool.uv.sources]
python-keycloak = { git = "https://github.com/banb3515/python-keycloak.git", branch = "master" }

[tool.hatch.build.targets.sdist]
include = ["./app"]

[tool.hatch.build.targets.wheel]
include = ["./app"]

[tool.hatch.build.targets.wheel.sources]
"./app" = "app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
