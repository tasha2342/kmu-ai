[loggers]
keys=root,uvicorn.error,uvicorn.access,gunicorn.error,gunicorn.access

[handlers]
keys=file,console

[formatters]
keys=file,console

[logger_root]
level=INFO
handlers=

[logger_uvicorn.error]
level=ERROR
handlers=file,console
qualname=uvicorn.error
propagate=0

[logger_uvicorn.access]
level=INFO
handlers=file
qualname=uvicorn.access
propagate=0

[logger_gunicorn.error]
level=ERROR
handlers=file,console
qualname=gunicorn.error
propagate=0

[logger_gunicorn.access]
level=INFO
handlers=file
qualname=gunicorn.access
propagate=0

[handler_file]
class=app.utils.logger.MakeTimedRotatingFileHandler
level=NOTSET
formatter=file
args=("logs/server/log.txt", "midnight", 1, 30, "utf8", True)

[formatter_file]
format=%(levelname)-8s | %(asctime)s.%(msecs)03d | %(name)-15s - %(message)s
class=logging.Formatter
datefmt=%Y-%m-%d %H:%M:%S

[handler_console]
class=app.utils.logger.CustomRichHandler
level=ERROR
formatter=console
args=(0,)

[formatter_console]
format=%(message)s
class=logging.Formatter
datefmt=%Y-%m-%d %H:%M:%S
