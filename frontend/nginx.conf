server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 챗봇 첨부(최대 10MB)·문서 업로드가 기본값(1MB)에 잘리지 않도록 여유 있게 잡습니다.
    client_max_body_size 20m;

    # 백엔드 API 프록시 (동일 출처로 호출하므로 CORS 설정 불필요)
    # kmu-ai-api 컨테이너는 jdone-network 안에서 13000 포트로 서비스합니다.
    #
    # NOTE: proxy_pass에 호스트명을 직접 쓰면 nginx가 "기동 시점"에 DNS를 해석하므로,
    #       kmu-ai-api가 아직 안 떠 있으면 프론트 컨테이너 자체가 起動에 실패합니다.
    #       변수를 쓰면 "요청 시점"에 해석하므로 백엔드가 없어도 프론트는 정상 기동하고
    #       해당 요청만 502를 반환합니다. (127.0.0.11 = Docker 임베디드 DNS)
    #       변수를 쓰면 location 접두사 치환이 동작하지 않으므로 $request_uri로 원본 경로를
    #       그대로 전달합니다. (/v1/ 접두사가 백엔드와 동일하므로 결과는 같습니다)
    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kmu_api_upstream kmu-ai-api;
        proxy_pass http://$kmu_api_upstream:13000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 챗봇 SSE 스트리밍 응답이 즉시 전달되도록 버퍼링을 비활성화합니다.
        proxy_buffering off;
        proxy_cache off;
        # 스트리밍 중 nginx가 먼저 연결을 끊지 않도록 충분히 길게 잡습니다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 백엔드가 내려가 있어도 nginx 자체는 살아있도록 짧게 실패시킵니다.
        proxy_connect_timeout 5s;
    }

    # Keycloak 토큰 엔드포인트 프록시 (kmu-ai realm 준비 후 로그인 플로우에서 사용)
    # 위와 같은 이유로 변수를 사용합니다. Keycloak이 아직 없어도 프론트는 정상 기동합니다.
    location /realms/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kmu_keycloak_upstream kmu-ai-keycloak;
        proxy_pass http://$kmu_keycloak_upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # Keycloak 로그인 화면의 테마 자산(css/js/img)
    # Keycloak은 로그인 페이지를 /realms/ 아래에서 내려주지만, 그 페이지가 참조하는 자산은
    # /resources/<빌드해시>/... 로 나갑니다. 이 경로를 프록시하지 않으면 아래 SPA fallback이
    # index.html을 대신 돌려줘서 로그인 화면이 스타일 없이 뜹니다. (실제로 겪은 문제)
    # SPA 번들은 /assets/ 를 쓰므로 경로가 겹치지 않습니다.
    location /resources/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kmu_keycloak_assets kmu-ai-keycloak;
        proxy_pass http://$kmu_keycloak_assets:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # 정적 자산은 해시 파일명이므로 길게 캐시합니다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅 (새로고침/직접 진입 대응)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
