services:
  kmu-ai-api:
    container_name: kmu-ai-api
    image: jdone/kmu-ai-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_OBFUSCATION: false # 코드 난독화 여부
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 100 # 10 MB * 100 = 1 GB
    environment:
      PYTHONUNBUFFERED: 1
      # 임베딩 모델을 이 컨테이너 안에서 직접 돌린다. (app/utils/embedder.py)
      # 루트 파일시스템이 read_only라 캐시 경로는 쓰기 가능한 resources 볼륨으로 돌린다.
      HF_HOME: /app/resources/.cache/huggingface
      TORCH_HOME: /app/resources/.cache/torch
      EMBEDDING_TORCH_THREADS: 16 # 임베딩 forward에 쓸 CPU 스레드 수 (호스트 64코어를 전부 잡지 않도록 제한)
      # 미입력 세션 자동 종료 (.env로 설정, KAI-REQ-039)
      # 컨테이너는 .env를 직접 읽지 않으므로 여기서 명시적으로 전달해야 한다.
      ENABLE_SESSION_IDLE_TIMEOUT: ${ENABLE_SESSION_IDLE_TIMEOUT:-true}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - 8003:13000
    volumes:
      - ./static:/app/static:ro # 정적 파일 경로
      - ./configs:/app/configs:ro # 설정 경로
      # 리소스 경로. 모델 가중치(resources/models/<org>--<name>)도 이 마운트에 포함된다.
      - ./resources:/app/resources
      # 원래 여기에 `/data2/models:/app/resources/models`가 있었다. (pet-pass-one-node와 가중치 공유용)
      # 이 머신에는 /data2가 없어서 그대로 두면 도커가 root 소유 빈 디렉토리를 만들어 위 마운트 위에
      # 덮어씌우고, 임베딩 가중치를 못 읽는다. (app/utils/embedder.py가 resources/models에서 읽는다)
      # ./resources가 이미 /app/resources로 마운트되어 있으므로 ./resources/models를 따로 마운트하면
      # 같은 경로를 두 번 마운트하는 꼴이 된다. 줄을 지우는 것이 가장 단순하고 안전하다.
      # 가중치는 호스트의 ./resources/models/nlpai-lab--KURE-v1에 둔다.
      # /data2가 있는 서버에 배포할 때만 아래 줄을 되살릴 것.
      # - /data2/models:/app/resources/models
      - ./logs:/app/logs # 로그 경로
    networks:
      - jdone-network

  postgres:
    container_name: kmu-ai-postgres
    build:
      context: ./docker/postgres
    image: kmu-ai-postgres-pgvector:16-3.4 # PostGIS + pgvector (docker/postgres/Dockerfile)
    restart: unless-stopped
    environment:
      POSTGRES_USER: jdone
      POSTGRES_PASSWORD: ${KMU_AI_DB_PASSWORD}
      POSTGRES_DB: kmu_ai
    ports:
      - 5435:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdone -d kmu_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jdone-network

  keycloak-postgres: # Keycloak 전용 DB (kmu-ai 앱 DB(5435)와 별개)
    image: postgres:16-alpine
    container_name: kmu-ai-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: jdone
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - 5437:5432 # Keycloak 전용 DB (호스트 5437 -> 컨테이너 5432, 5436은 pet-pass-one-node-postgres 사용 중)
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdone -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jdone-network

  keycloak: # kmu-ai 전용 Keycloak (다른 프로젝트 Keycloak과 별개)
    image: quay.io/keycloak/keycloak:25.0
    container_name: kmu-ai-keycloak
    # configs/keycloak-realm.json을 기동 시 자동 반영한다. 이 파일이 곧
    # configs/config.yaml의 auth 블록이 기대하는 realm/client/역할 구조이므로,
    # 손으로 만들면 어긋나기 쉽다. (client secret 하나만 달라도 인증이 통째로 실패한다)
    # --import-realm은 realm이 이미 있으면 건너뛰므로 재기동에 안전하다.
    # realm 정의를 바꾼 뒤 다시 반영하려면 keycloak-postgres-data 볼륨을 지워야 한다.
    command: start-dev --import-realm
    restart: unless-stopped
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: jdone
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      # 반드시 컨테이너명을 쓴다. jdone-network는 프로젝트 공유 네트워크라
      # compose 서비스명(keycloak-postgres)이 pet-pass-one의 동명 컨테이너와 별칭이 겹쳐
      # 다른 프로젝트의 Keycloak DB에 붙어버린다. (실제로 겪은 문제)
      KC_DB_URL_HOST: kmu-ai-keycloak-postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: jdone
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      # --import-realm은 이 디렉토리 안의 *.json만 읽는다. 파일을 직접 마운트한다.
      - ./configs/keycloak-realm.json:/opt/keycloak/data/import/kmu-ai-realm.json:ro
    ports:
      - 8082:8080 # kmu-ai 전용 Keycloak (호스트 8082 -> 컨테이너 8080)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - jdone-network

  redis:
    container_name: kmu-ai-redis
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 10
    volumes:
      - redis-data:/data
    networks:
      - jdone-network

  frontend: # 챗봇 대화 + 관리자 화면 (React/Vite 빌드 -> nginx 정적 서빙)
    container_name: kmu-ai-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # 기동 순서용일 뿐이다. nginx가 업스트림을 요청 시점에 해석하도록 구성해 두어
    # API나 Keycloak이 늦게 떠도 프론트 컨테이너는 정상 기동한다.
    depends_on:
      - kmu-ai-api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 10
    ports:
      - 3002:80
    networks:
      - jdone-network

networks:
  jdone-network:
    name: jdone-network

volumes:
  postgres-data:
    name: kmu-ai-postgres-data
  redis-data:
    name: kmu-ai-redis-data
  keycloak-postgres-data:
    name: kmu-ai-keycloak-postgres-data
