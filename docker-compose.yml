services:
  kmu-ai-api:
    container_name: kmu-ai-api
    image: jdone/kmu-ai-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_OBFUSCATION: false # 코드 난독화 여부
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 100 # 10 MB * 100 = 1 GB
    environment:
      PYTHONUNBUFFERED: 1
      # 임베딩 모델을 이 컨테이너 안에서 직접 돌린다. (app/utils/embedder.py)
      # 루트 파일시스템이 read_only라 캐시 경로는 쓰기 가능한 resources 볼륨으로 돌린다.
      HF_HOME: /app/resources/.cache/huggingface
      TORCH_HOME: /app/resources/.cache/torch
      # 임베딩 forward에 쓸 CPU 스레드 수. 워커 수 × 이 값이 호스트 코어 수를 넘지 않아야 한다.
      # 넘기면 스레드 경합으로 임베딩이 수십 배 느려지고(4코어에서 16스레드 = 짧은 문장 하나에 108초),
      # 이벤트 루프까지 굶어 DB 커넥션 획득이 타임아웃되면서 무관한 요청들이 503으로 떨어진다.
      # 64코어 운영 호스트는 .env에서 16으로 올린다.
      EMBEDDING_TORCH_THREADS: ${EMBEDDING_TORCH_THREADS:-2}
      # gunicorn 워커 수. 워커마다 임베딩 모델을 자기 메모리에 따로 올리므로(KURE-v1 기준 약 2.2GB)
      # 코어 수가 아니라 가용 메모리가 상한을 정한다. 개발 서버(4코어/3.8GB)는 1개가 한계다.
      # 넉넉한 운영 호스트는 .env에서 올린다.
      WORKERS: ${WORKERS:-1}
      # 미입력 세션 자동 종료 (.env로 설정, KAI-REQ-039)
      # 컨테이너는 .env를 직접 읽지 않으므로 여기서 명시적으로 전달해야 한다.
      ENABLE_SESSION_IDLE_TIMEOUT: ${ENABLE_SESSION_IDLE_TIMEOUT:-true}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - 8003:13000
    volumes:
      - ./static:/app/static:ro # 정적 파일 경로
      - ./configs:/app/configs:ro # 설정 경로
      # 리소스 경로. 모델 가중치(resources/models/<org>--<name>)도 이 마운트에 포함된다.
      - ./resources:/app/resources
      # 원래 여기에 `/data2/models:/app/resources/models`가 있었다. (pet-pass-one-node와 가중치 공유용)
      # 이 머신에는 /data2가 없어서 그대로 두면 도커가 root 소유 빈 디렉토리를 만들어 위 마운트 위에
      # 덮어씌우고, 임베딩 가중치를 못 읽는다. (app/utils/embedder.py가 resources/models에서 읽는다)
      # ./resources가 이미 /app/resources로 마운트되어 있으므로 ./resources/models를 따로 마운트하면
      # 같은 경로를 두 번 마운트하는 꼴이 된다. 줄을 지우는 것이 가장 단순하고 안전하다.
      # 가중치는 호스트의 ./resources/models/nlpai-lab--KURE-v1에 둔다.
      # /data2가 있는 서버에 배포할 때만 아래 줄을 되살릴 것.
      # - /data2/models:/app/resources/models
      - ./logs:/app/logs # 로그 경로
    networks:
      - jdone-network

  postgres:
    container_name: kmu-ai-postgres
    build:
      context: ./docker/postgres
    image: kmu-ai-postgres-pgvector:16-3.4 # PostGIS + pgvector (docker/postgres/Dockerfile)
    restart: unless-stopped
    environment:
      POSTGRES_USER: jdone
      POSTGRES_PASSWORD: ${KMU_AI_DB_PASSWORD}
      POSTGRES_DB: kmu_ai
    ports:
      - 5435:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdone -d kmu_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jdone-network

  # DB 조회용 웹 콘솔. 마스킹 저장값 검증처럼 테이블을 눈으로 확인할 때 쓴다.
  # 애플리케이션 동작에는 관여하지 않으므로 운영에서는 빼거나 외부 노출을 막을 것.
  pgadmin:
    container_name: kmu-ai-pgadmin
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 로그인 계정. .env에서 덮어쓸 수 있다.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@jdone.co.kr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin}
      # 저장된 서버 비밀번호를 꺼낼 때 마스터 비밀번호를 따로 묻지 않게 한다.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # 컨테이너 내부 포트. 호스트 5050과 매핑한다.
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      # 서버 등록 정보를 미리 넣어 둔다. pgadmin-data 볼륨이 빈 최초 기동에만 반영되므로,
      # 내용을 바꾼 뒤 다시 적용하려면 볼륨을 지워야 한다.
      # 접속 대상은 반드시 컨테이너명(kmu-ai-postgres)으로 둔다. jdone-network는 프로젝트
      # 공유 네트워크라 서비스명 postgres는 다른 프로젝트 DB로 붙을 수 있다.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - 5050:80
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 10
    networks:
      - jdone-network

  keycloak-postgres: # Keycloak 전용 DB (kmu-ai 앱 DB(5435)와 별개)
    image: postgres:16-alpine
    container_name: kmu-ai-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: jdone
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - 5437:5432 # Keycloak 전용 DB (호스트 5437 -> 컨테이너 5432, 5436은 pet-pass-one-node-postgres 사용 중)
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdone -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jdone-network

  keycloak: # kmu-ai 전용 Keycloak (다른 프로젝트 Keycloak과 별개)
    image: quay.io/keycloak/keycloak:25.0
    container_name: kmu-ai-keycloak
    # configs/keycloak-realm.json을 기동 시 자동 반영한다. 이 파일이 곧
    # configs/config.yaml의 auth 블록이 기대하는 realm/client/역할 구조이므로,
    # 손으로 만들면 어긋나기 쉽다. (client secret 하나만 달라도 인증이 통째로 실패한다)
    # --import-realm은 realm이 이미 있으면 건너뛰므로 재기동에 안전하다.
    # realm 정의를 바꾼 뒤 다시 반영하려면 keycloak-postgres-data 볼륨을 지워야 한다.
    command: start-dev --import-realm
    restart: unless-stopped
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: jdone
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      # 반드시 컨테이너명을 쓴다. jdone-network는 프로젝트 공유 네트워크라
      # compose 서비스명(keycloak-postgres)이 pet-pass-one의 동명 컨테이너와 별칭이 겹쳐
      # 다른 프로젝트의 Keycloak DB에 붙어버린다. (실제로 겪은 문제)
      KC_DB_URL_HOST: kmu-ai-keycloak-postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: jdone
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      # --import-realm은 이 디렉토리 안의 *.json만 읽는다. 파일을 직접 마운트한다.
      - ./configs/keycloak-realm.json:/opt/keycloak/data/import/kmu-ai-realm.json:ro
    ports:
      - 8082:8080 # kmu-ai 전용 Keycloak (호스트 8082 -> 컨테이너 8080)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - jdone-network

  redis:
    container_name: kmu-ai-redis
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 10
    volumes:
      - redis-data:/data
    networks:
      - jdone-network

  # 챗봇 첨부·문서 업로드용 S3 호환 스토리지.
  # API는 jdone-network 안에서 kmu-ai-minio:9000 으로 붙는다.
  minio:
    container_name: kmu-ai-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - 9005:9000 # API (호스트). 컨테이너 간에는 kmu-ai-minio:9000
      - 9006:9001 # 콘솔 (호스트)
    volumes:
      - minio-data:/data
    # minio/minio는 scratch 기반이라 curl/bash 헬스체크를 넣을 수 없다.
    # API는 첨부 요청 시에만 S3에 붙고, 버킷은 그때 자동 생성한다.
    networks:
      - jdone-network

  frontend: # 챗봇 대화 + 관리자 화면 (React/Vite 빌드 -> nginx 정적 서빙)
    container_name: kmu-ai-frontend
    image: kmu-ai-frontend:latest # 폐쇄망: ys에서 빌드해 load한 이미지 사용(빌드 회피)
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # 기동 순서용일 뿐이다. nginx가 업스트림을 요청 시점에 해석하도록 구성해 두어
    # API나 Keycloak이 늦게 떠도 프론트 컨테이너는 정상 기동한다.
    depends_on:
      - kmu-ai-api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 10
    ports:
      - 3002:80
    networks:
      - jdone-network

  # ─── Milvus (선택. profile=milvus. 기본 `compose up`에는 안 뜸) ───────────
  # 공식 standalone: etcd + MinIO + milvus + Attu.
  # 앱 첨부용 `minio`(kmu-ai-minio)와는 별개다.
  # 개발 서버(≈4GB)에서는 OOM이 나므로 기본 비활성. dense는 config milvus.enabled=false → pgvector.
  # 켤 때: docker compose --profile milvus up -d  그리고 config.yaml milvus.enabled: true
  # jdone-network는 프로젝트 공유망이라 ETCD/MINIO/MILVUS 주소는 반드시 컨테이너명을 쓴다.

  milvus-etcd:
    profiles: ["milvus"]
    container_name: kmu-ai-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    # 호스트에 이미 etcd(2379/2380)가 떠 있을 수 있어 포트를 노출하지 않는다.
    # advertise는 컨테이너명으로 두어 공유 네트워크에서 서비스명 충돌을 피한다.
    command: >
      etcd
      -advertise-client-urls=http://kmu-ai-milvus-etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - jdone-network

  # Milvus 전용 오브젝트 스토리지. 앱 S3(`minio` / kmu-ai-minio)와 분리한다.
  # 호스트 포트는 열지 않는다. (앱 MinIO가 이미 9005/9006을 쓰고, Milvus만 내부 접속하면 됨)
  milvus-minio:
    profiles: ["milvus"]
    container_name: kmu-ai-milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - jdone-network

  milvus:
    profiles: ["milvus"]
    container_name: kmu-ai-milvus
    # v3는 이미지·메모리가 커서 이 호스트에서 restart loop(OOM). 2.5 계열로 고정.
    image: milvusdb/milvus:v2.5.14
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: kmu-ai-milvus-etcd:2379
      MINIO_ADDRESS: kmu-ai-milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - 19530:19530 # gRPC (pymilvus / 앱 접속)
      - 9091:9091   # healthz + Milvus WebUI (http://localhost:9091/webui/)
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 10
    networks:
      - jdone-network

  # Milvus 관리자 GUI (Attu). pgAdmin과 같이 앱 동작에는 관여하지 않는다.
  # 브라우저: http://localhost:8004  → 연결 주소는 컨테이너망 기준 kmu-ai-milvus:19530
  attu:
    profiles: ["milvus"]
    container_name: kmu-ai-attu
    image: zilliz/attu:v2.5
    restart: unless-stopped
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      MILVUS_URL: kmu-ai-milvus:19530
    ports:
      - 8004:3000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 10
    networks:
      - jdone-network

networks:
  jdone-network:
    name: jdone-network

volumes:
  postgres-data:
    name: kmu-ai-postgres-data
  redis-data:
    name: kmu-ai-redis-data
  keycloak-postgres-data:
    name: kmu-ai-keycloak-postgres-data
  minio-data:
    name: kmu-ai-minio-data
  pgadmin-data:
    name: kmu-ai-pgadmin-data
  milvus-etcd-data:
    name: kmu-ai-milvus-etcd-data
  milvus-minio-data:
    name: kmu-ai-milvus-minio-data
  milvus-data:
    name: kmu-ai-milvus-data
